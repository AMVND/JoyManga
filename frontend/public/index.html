<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f5fd6" />
    <meta name="description" content="JoyManga - đọc truyện tranh miễn phí từ MangaDex, giao diện đơn giản, dùng tốt trên điện thoại và máy tính." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f5fd6'/%3E%3Cpath d='M22 28h24v46H22zM54 28h24v46H54z' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>JoyManga</title>
    <script>
      // Áp dụng giao diện sáng/tối trước khi React chạy để không bị chớp màn hình.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('joymanga.theme'));
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Bạn cần bật JavaScript để dùng ứng dụng này.</noscript>
    <div id="root"></div>
  </body>
</html>
